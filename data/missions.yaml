# CLPS missions (NASA Commercial Lunar Payload Services) as of late September 2026.
#
# Fields:
#   status    — success | partial | failure | planned
#   launch    — launch date (ISO if flown, else plan text as in the source: "NET Q1 2027")
#   landing   — actual landing, UTC; end — end of surface operations
#   site      — catalog site id (data/sites.yaml), if the landing site is in it
#   where     — landing point (precision: landed) or region centre (precision: region, radius_km)
#               per the IAU gazetteer; exact points of planned missions are unpublished
#   window    — period analysed in the browser (landing to end of operations, with margin)
#   payloads  — NASA payloads
#   sources   — data sources
#
# Overview: science.nasa.gov/lunar-science/clps-deliveries, en.wikipedia.org/wiki/Commercial_Lunar_Payload_Services

missions:
  - id: peregrine
    name: Peregrine Mission One
    provider: Astrobotic
    lander: Peregrine
    task_order: TO2-AB
    launch: "2024-01-08"
    status: failure
    outcome: "Propellant leak after launch; never attempted a landing, re-entered Earth’s atmosphere on 18 Jan 2024."
    where: {name: "Sinus Viscositatis (target)", precision: none}
    payloads: [Laser Retroreflector Array, Linear Energy Transfer Spectrometer, Navigation Doppler Lidar,
               Near-Infrared Volatile Spectrometer System, Neutron Spectrometer System, Peregrine Ion-Trap Mass Spectrometer]
    sources: [https://en.wikipedia.org/wiki/Peregrine_Mission_One, https://science.nasa.gov/lunar-science/clps-deliveries/]

  - id: im-1
    name: IM-1 · Odysseus
    provider: Intuitive Machines
    lander: Nova-C
    task_order: TO2-IM
    launch: "2024-02-15"
    landing: "2024-02-22T23:24Z"
    end: "2024-02-29"
    status: partial
    outcome: "First US soft landing since 1972, but it came down on a 12° slope, broke a leg and tipped over; operated until its solar power faded a week later."
    site: im1-odysseus
    where: {name: "Malapert A region", lat: -80.13, lon: 1.44, precision: landed}
    window: ["2024-02-22", "2024-03-07"]
    payloads: [Laser Retro-Reflector Array, Navigation Doppler Lidar, Lunar Node 1 Navigation Demonstrator,
               Stereo Cameras for Lunar Plume-Surface Studies, ROLSES radio observations, Radio Frequency Mass Gauge]
    sources: [https://en.wikipedia.org/wiki/IM-1, https://science.nasa.gov/lunar-science/clps-deliveries/]

  - id: blue-ghost-1
    name: Blue Ghost Mission 1
    provider: Firefly Aerospace
    lander: Blue Ghost
    task_order: TO19D
    launch: "2025-01-15"
    landing: "2025-03-02T08:34Z"
    end: "2025-03-16T23:25Z"
    status: success
    outcome: "First fully successful commercial Moon landing; all 10 NASA payloads returned data through a full lunar day until the batteries ran out after sunset."
    where: {name: "Mare Crisium, near Mons Latreille", lat: 18.567, lon: 61.817, precision: landed}
    payloads: [Regolith Adherence Characterization, Next Generation Lunar Retroreflector, LEXI X-ray imager,
               RadPC radiation-tolerant computer, Lunar Magnetotelluric Sounder, LISTER heat-flow drill, Lunar PlanetVac,
               SCALPSS 1.1 plume cameras, Electrodynamic Dust Shield, Lunar GNSS Receiver Experiment]
    sources: [https://en.wikipedia.org/wiki/Blue_Ghost_Mission_1, https://science.nasa.gov/lunar-science/clps-deliveries/]

  - id: im-2
    name: IM-2 · Athena
    provider: Intuitive Machines
    lander: Nova-C
    task_order: PRIME-1
    launch: "2025-02-27"
    landing: "2025-03-06T17:29Z"
    end: "2025-03-07"
    status: failure
    outcome: "An altimeter fault left the lander without accurate altitude; it hit a plateau, tipped over and came to rest in a crater, and its power ran out about 13 hours later."
    site: im2-athena
    where: {name: "Mons Mouton", lat: -84.7906, lon: 29.1958, precision: landed}
    window: ["2025-03-06", "2025-03-20"]
    payloads: [PRIME-1 ice-mining experiment (TRIDENT drill and MSolo mass spectrometer)]
    sources: [https://en.wikipedia.org/wiki/IM-2, https://science.nasa.gov/lunar-science/clps-deliveries/]

  - id: griffin-1
    name: Griffin Mission One
    provider: Astrobotic
    lander: Griffin
    task_order: TO20A
    launch: "NET November 2026"
    status: planned
    outcome: "Originally meant to carry VIPER; now flies Astrolab’s FLIP rover and other commercial cargo to the south pole."
    where: {name: "Nobile crater region", lat: -85.28, lon: 53.27, precision: region, radius_km: 40}
    payloads: []
    sources: [https://en.wikipedia.org/wiki/Griffin_Mission_One]

