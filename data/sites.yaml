# Lunar south pole sites.
#
# lat  — latitude, deg, south negative
# lon  — east longitude, deg 0..360
# elev — surface height above the 1737.4 km sphere, m (LOLA DEM)
# tile — LOLA 5 m tile (data/dem/sites/<tile>/), if any
# sfs  — 5 m Shape-from-Shading region (data/dem/sfs/, Bertone et al.), if any;
#        SfS wins where both exist (same grid, real small-scale detail)
#
# For sites with 5 m terrain lat/lon/elev is the recommended landing point:
# best 18.6-year mean illumination among spots with slope <= 10°
# within 7 km, panels at 2 m (python -m pipeline.refine --all).
#
# origin  — starting point: Barker et al. (2021) tile centre or Artemis III
#           region centre (Bertone et al.). Often on a slope, see out/refine/.
# landing — slope at the landing point and its distance from origin.

sites:
  # --- lit candidates ------------------------------------------------------
  - id: connecting-ridge
    name: Connecting Ridge
    tile: Site01
    sfs: A306
    lat: -89.4392
    lon: 222.903
    elev: 1960
    origin: {lat: -89.4632, lon: 222.5104, elev: 1945}  # tile/region centre
    landing: {slope_deg: 5.7, offset_m: 738}  # pipeline.refine
    note: |
      Ridge between Shackleton and de Gerlache craters. Artemis III candidate region,
      one of the best-lit places at the pole.

  - id: shackleton-rim
    name: Shackleton rim
    tile: Site04
    lat: -89.7804
    lon: 203.803
    elev: 1739
    origin: {lat: -89.7668, lon: 188.13, elev: 768}  # tile/region centre
    landing: {slope_deg: 1.1, offset_m: 1916}  # pipeline.refine
    note: |
      Shackleton crater rim right by the pole. The tile centre is on the inner
      slope (768 m); the crest, up to 1739 m, is ~2 km away.

  - id: peak-near-shackleton
    name: Peak near Shackleton
    tile: Site07
    sfs: A308
    lat: -88.8084
    lon: 123.726
    elev: 1649
    origin: {lat: -88.8110, lon: 123.69, elev: 1646}  # tile/region centre
    landing: {slope_deg: 1.6, offset_m: 81}  # pipeline.refine
    note: Isolated peak; the tile centre is on the summit (1649 m, 85 m away).

  - id: de-gerlache-rim
    name: de Gerlache rim
    tile: Site11
    sfs: A309
    lat: -88.6646
    lon: 291.616
    elev: 1819
    origin: {lat: -88.6834, lon: 292.07, elev: 1794}  # tile/region centre
    landing: {slope_deg: 8.2, offset_m: 653}  # pipeline.refine

  - id: mons-mouton
    name: Mons Mouton plateau (Leibnitz β)
    tile: Site20
    sfs: A310
    lat: -85.4050
    lon: 31.703
    elev: 6464
    origin: {lat: -85.4266, lon: 31.74, elev: 6399}  # tile/region centre
    landing: {slope_deg: 3.6, offset_m: 662}  # pipeline.refine
    note: |
      Summit plateau of Mons Mouton (formerly Leibnitz beta), VIPER's target.
      Catalogs put the mountain's centre at 84.6°S; the lit plateau is further south.

  - id: nobile-rim-1
    name: Nobile rim 1
    tile: Site06
    sfs: A307
    lat: -85.2923
    lon: 36.996
    elev: 6773
    origin: {lat: -85.4381, lon: 37.37, elev: 5946}  # tile/region centre
    landing: {slope_deg: 2.0, offset_m: 4523}  # pipeline.refine
    note: Tile centre on a slope rising to a ~6.5-6.8 km massif.

  - id: nobile-rim-2
    name: Nobile rim 2
    tile: DM2
    sfs: A301
    lat: -84.0964
    lon: 59.613
    elev: 1437
    origin: {lat: -83.9540, lon: 58.82, elev: 1010}  # tile/region centre
    landing: {slope_deg: 1.2, offset_m: 5005}  # pipeline.refine

  - id: malapert-massif
    name: Malapert massif
    tile: Site23
    sfs: A311
    lat: -86.0007
    lon: 2.054
    elev: 5162
    origin: {lat: -85.9948, lon: 359.76, elev: 4784}  # tile/region centre
    landing: {slope_deg: 1.7, offset_m: 4863}  # pipeline.refine
    note: High massif with good Earth visibility, a historical relay candidate.

  # --- Artemis III candidate regions with SfS only (no LOLA 5 m tile) ------
  # Centre = centre of the region rectangle (Bertone et al.), not a chosen point.

  - id: connecting-ridge-ext
    name: Connecting Ridge Extension
    sfs: A305
    lat: -89.0050
    lon: 263.592
    elev: 1561
    origin: {lat: -89.032, lon: 258.00, elev: 1179}  # tile/region centre
    landing: {slope_deg: 3.2, offset_m: 3016}  # pipeline.refine
    note: Continuation of Connecting Ridge; centre on a slope, ~1370 m crest 1 km away.

  - id: de-gerlache-rim-2
    name: de Gerlache Rim 2
    sfs: A304
    lat: -88.3935
    lon: 291.376
    elev: 1518
    origin: {lat: -88.230, lon: 295.37, elev: -88}  # tile/region centre
    landing: {slope_deg: 2.0, offset_m: 6106}  # pipeline.refine

  - id: faustini-rim-a
    name: Faustini Rim A
    sfs: A303
    lat: -87.7717
    lon: 94.696
    elev: 579
    origin: {lat: -87.890, lon: 90.00, elev: 47}  # tile/region centre
    landing: {slope_deg: 1.7, offset_m: 6474}  # pipeline.refine
    note: Rim of Faustini crater (permanent shadow and likely water ice inside).

  - id: de-gerlache-kocher
    name: de Gerlache–Kocher Massif
    sfs: A312
    lat: -85.6816
    lon: 243.389
    elev: 2956
    origin: {lat: -85.830, lon: 243.68, elev: 2710}  # tile/region centre
    landing: {slope_deg: 1.6, offset_m: 4553}  # pipeline.refine

  - id: amundsen-rim
    name: Amundsen Rim
    sfs: A300
    lat: -84.4112
    lon: 69.325
    elev: 843
    origin: {lat: -84.229, lon: 69.44, elev: 401}  # tile/region centre
    landing: {slope_deg: 2.7, offset_m: 5549}  # pipeline.refine

  # --- real missions -------------------------------------------------------
  - id: im2-athena
    name: IM-2 Athena landing site
    lat: -84.7906
    lon: 29.1958
    elev: 5322
    note: |
      Intuitive Machines IM-2 landing site (6 March 2025, CLPS). The lander came
      down intact but on its side. Outside the 5 m tiles: 20 m DEM only.

  - id: im1-odysseus
    name: IM-1 Odysseus landing site
    lat: -80.13
    lon: 1.44
    elev: 2592
    note: |
      Intuitive Machines IM-1 (22 February 2024, CLPS), near Malapert A crater.
      20-30 m terrain. By our calculation the Sun set there on 2 March 2024.

  - id: chandrayaan-3
    name: Chandrayaan-3 Vikram landing site
    lat: -69.373
    lon: 32.319
    elev: 529
    note: |
      ISRO, 23 August 2023. 120 m terrain only. Our calculation: sunset
      4 September 2023 (ISRO put Vikram to sleep that day), sunrise 19-20 September.

  # --- contrast: permanent shadow -----------------------------------------
  # The Haworth and Shoemaker tiles are sites next to the craters, not their floors:
  # only 2-5% of the area within 15 km is permanently shadowed. The point here is
  # the pixel nearest the tile centre that is fully surrounded by permanent shadow
  # (LPSR_80S_20MPP map, Barker et al. 2023). The model should give ~0% Sun.

  - id: haworth
    name: Haworth crater (permanent shadow)
    tile: Haworth
    sfs: A302
    lat: -86.7715
    lon: 337.135
    elev: 1610
    origin: {lat: -86.7639, lon: 337.22, elev: 1628}  # tile centre
    note: Permanently shadowed point 270 m from the tile centre; possible water ice.

  - id: shoemaker
    name: Shoemaker crater (permanent shadow)
    tile: Shoemaker
    lat: -87.1713
    lon: 62.984
    elev: 471
    origin: {lat: -87.1835, lon: 62.84, elev: 548}  # tile centre
    note: Permanently shadowed point 430 m from the tile centre.

  # --- control points for checking the maths ------------------------------
  - id: check-equator
    name: "CHECK: equator, 0E"
    lat: 0.0
    lon: 0.0
    elev: 0
    note: Sanity check — a solar day should come out at ~29.53 days.

  - id: check-south-pole
    name: "CHECK: geographic south pole"
    lat: -90.0
    lon: 0.0
    elev: 0
    note: |
      Sanity check — Sun elevation within ~±1.6° (lunar axial tilt),
      Earth near the horizon with ~±7° libration.
