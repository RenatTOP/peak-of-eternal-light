# Lunar south pole sites.
#
# lat  — latitude, deg, south negative
# lon  — east longitude, deg 0..360
# elev — surface height above the 1737.4 km sphere, m (LOLA DEM)
# tile — LOLA 5 m tile (data/dem/sites/<tile>/), if any
# sfs  — 5 m Shape-from-Shading region (data/dem/sfs/, Bertone et al.), if any;
#        SfS wins where both exist (same grid, real small-scale detail)
#
# Coordinates of points with a tile are the Barker et al. (2021) tile centre; the tiles were built
# around the Mazarico et al. (2011) sites. From: python -m pipeline.site_tiles
#
# refine: true means the tile centre is not the highest/best-lit point
# (e.g. on a slope). To be refined once horizon.py computes the tile's illumination map.

sites:
  # --- lit candidates ------------------------------------------------------
  - id: connecting-ridge
    name: Connecting Ridge
    tile: Site01
    sfs: A306
    lat: -89.4632
    lon: 222.5104
    elev: 1945
    note: |
      Ridge between Shackleton and de Gerlache craters. Artemis III candidate region,
      one of the best-lit places at the pole.

  - id: shackleton-rim
    name: Shackleton rim
    tile: Site04
    lat: -89.7668
    lon: 188.13
    elev: 768
    refine: true
    note: |
      Shackleton crater rim right by the pole. The tile centre is on the inner
      slope (768 m); the crest, up to 1739 m, is ~2 km away.

  - id: peak-near-shackleton
    name: Peak near Shackleton
    tile: Site07
    sfs: A308
    lat: -88.8110
    lon: 123.69
    elev: 1646
    note: Isolated peak; the tile centre is on the summit (1649 m, 85 m away).

  - id: de-gerlache-rim
    name: de Gerlache rim
    tile: Site11
    sfs: A309
    lat: -88.6834
    lon: 292.07
    elev: 1794

  - id: mons-mouton
    name: Mons Mouton plateau (Leibnitz β)
    tile: Site20
    sfs: A310
    lat: -85.4266
    lon: 31.74
    elev: 6399
    note: |
      Summit plateau of Mons Mouton (formerly Leibnitz beta), VIPER's target.
      Catalogs put the mountain's centre at 84.6°S; the lit plateau is further south.

  - id: nobile-rim-1
    name: Nobile rim 1
    tile: Site06
    sfs: A307
    lat: -85.4381
    lon: 37.37
    elev: 5946
    refine: true
    note: Tile centre on a slope rising to a ~6.5-6.8 km massif.

  - id: nobile-rim-2
    name: Nobile rim 2
    tile: DM2
    sfs: A301
    lat: -83.9540
    lon: 58.82
    elev: 1010

  - id: malapert-massif
    name: Malapert massif
    tile: Site23
    sfs: A311
    lat: -85.9948
    lon: 359.76
    elev: 4784
    note: High massif with good Earth visibility, a historical relay candidate.

  # --- Artemis III candidate regions with SfS only (no LOLA 5 m tile) ------
  # Centre = centre of the region rectangle (Bertone et al.), not a chosen point.

  - id: connecting-ridge-ext
    name: Connecting Ridge Extension
    sfs: A305
    lat: -89.032
    lon: 258.00
    elev: 1179
    refine: true
    note: Continuation of Connecting Ridge; centre on a slope, ~1370 m crest 1 km away.

  - id: de-gerlache-rim-2
    name: de Gerlache Rim 2
    sfs: A304
    lat: -88.230
    lon: 295.37
    elev: -88
    refine: true

  - id: faustini-rim-a
    name: Faustini Rim A
    sfs: A303
    lat: -87.890
    lon: 90.00
    elev: 47
    refine: true
    note: Rim of Faustini crater (permanent shadow and likely water ice inside).

  - id: de-gerlache-kocher
    name: de Gerlache–Kocher Massif
    sfs: A312
    lat: -85.830
    lon: 243.68
    elev: 2710

  - id: amundsen-rim
    name: Amundsen Rim
    sfs: A300
    lat: -84.229
    lon: 69.44
    elev: 401
    refine: true

  # --- real missions -------------------------------------------------------
  - id: im2-athena
    name: IM-2 Athena landing site
    lat: -84.7906
    lon: 29.1958
    elev: 5322
    note: |
      Intuitive Machines IM-2 landing site (6 March 2025, CLPS). The lander came
      down intact but on its side. Outside the 5 m tiles: 20 m DEM only.

  # --- contrast: permanent shadow -----------------------------------------
  - id: haworth
    name: Haworth crater
    tile: Haworth
    sfs: A302
    lat: -86.7639
    lon: 337.22
    elev: 1628
    note: Permanently shadowed crater; should show ~0% illumination.

  - id: shoemaker
    name: Shoemaker crater
    tile: Shoemaker
    lat: -87.1835
    lon: 62.84
    elev: 548
    note: Permanently shadowed crater.

  # --- control points for checking the maths ------------------------------
  - id: check-equator
    name: "CHECK: equator, 0E"
    lat: 0.0
    lon: 0.0
    elev: 0
    note: Sanity check — a solar day should come out at ~29.53 days.

  - id: check-south-pole
    name: "CHECK: geographic south pole"
    lat: -90.0
    lon: 0.0
    elev: 0
    note: |
      Sanity check — Sun elevation within ~±1.6° (lunar axial tilt),
      Earth near the horizon with ~±7° libration.
